# Builds ItemSlim for Windows x64 and Linux x64 when a release is published and attaches both to the release.
name: Release builds

on:
  release:
    types: [published]

permissions:
  contents: write          # needed to upload files to the release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (win-x64, linux-x64)
        run: |
          # use the tag as version when it looks like one (v1.2.3 / 1.2.3), else keep the csproj version
          VERSION="${TAG#v}"
          VERSION_ARG=""
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VERSION_ARG="-p:Version=$VERSION"; fi
          for rid in win-x64 linux-x64; do
            dotnet publish ItemSlim.csproj -c Release -r "$rid" -o "out/$rid" $VERSION_ARG
          done

      - name: Package
        run: |
          mkdir dist
          (cd out/win-x64 && zip -9 "../../dist/ItemSlim-$TAG-win-x64.zip" ItemSlim.exe)
          chmod 755 out/linux-x64/ItemSlim
          tar -czf "dist/ItemSlim-$TAG-linux-x64.tar.gz" -C out/linux-x64 ItemSlim
          ls -l dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
